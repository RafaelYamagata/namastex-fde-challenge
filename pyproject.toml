[project]
name = "autoseguro-agent"
version = "0.1.0"
description = "Agente de cotação de seguro auto para WhatsApp (desafio FDE Namastex)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "tzdata>=2026.5",
]

[project.scripts]
autoseguro = "autoseguro.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoseguro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real quote-service (spawned automatically)",
    "llm: calls the Anthropic API (needs ANTHROPIC_API_KEY)",
]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py312"
# code that came with the challenge stays as delivered
extend-exclude = ["quote-service", "scripts/generate_dataset.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
